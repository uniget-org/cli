include:
- local: pipeline/docker.yaml

prepare:
  rules:
  - if: $CI_MERGE_REQUEST_ID
  - when: always
  variables:
    GIT_DEPTH: 0
  script: |
    version="$( git describe --tags --abbrev=0 | tr -d v )"
    TAG="${version}"

    echo "Found version: ${version}"

    echo "version=${version}" >>build.env
    echo "TAG=${TAG}" >>build.env
  artifacts:
    reports:
      dotenv: build.env

build:image:
  rules:
  - if: $CI_MERGE_REQUEST_ID
  - when: always
  needs:
  - prepare
  parallel:
    matrix:
    - ARCH:
      - "amd64"
      - "arm64"
      TAG_SUFFIX: "-noble"
      CONTEXT: images/noble
    - ARCH:
      - "amd64"
      - "arm64"
      TAG_SUFFIX: "-resolute"
      CONTEXT: images/resolute
    - ARCH:
      - "amd64"
      - "arm64"
      TAG_SUFFIX: "-rolling"
      CONTEXT: images/rolling
    - ARCH:
      - "amd64"
      - "arm64"
      TAG_SUFFIX: "-resolute-systemd"
      CONTEXT: images/resolute-systemd
  extends:
  - .docker:build
  variables:
    BUILD_CONTEXT: ${CONTEXT}
    BUILD_ARGS: version
  tags:
  - saas-linux-medium-${ARCH}

build:multi_arch_index:
  needs:
  - prepare
  - build:image
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "-noble"
      - "-resolute"
      - "-rolling"
      - "-resolute-systemd"
  extends:
  - .build:multi_arch_index

sign:image:
  rules:
  - if: $PUSH == "true"
  needs:
  - prepare
  - build:multi_arch_index
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "-noble"
      - "-resolute"
      - "-rolling"
      - "-resolute-systemd"
  image: registry.gitlab.com/uniget-org/cli:noble
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
  - |
    uniget install cosign
  script:
  - |
    echo "### Signing image ${CI_REGISTRY_IMAGE}:${TAG}${TAG_SUFFIX}"
  - |
    cosign sign --yes \
        --registry-username "${CI_REGISTRY_USER}" \
        --registry-password "${CI_REGISTRY_PASSWORD}" \
        "${CI_REGISTRY_IMAGE}:${TAG}${TAG_SUFFIX}"

attest:image:
  rules:
  - if: $PUSH == "true"
  needs:
  - prepare
  - build:multi_arch_index
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "-noble"
      - "-resolute"
      - "-rolling"
      - "-resolute-systemd"
  image: registry.gitlab.com/uniget-org/cli:noble
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
  - |
    uniget install cosign
    uniget install jq
  script:
  - |
    echo "### Creating SLSA provenance predicate for ${CI_REGISTRY_IMAGE}:${TAG}${TAG_SUFFIX}"
  - |
    cat >provenance-predicate-${TAG}${TAG_SUFFIX}.json <<EOF
    {
      "buildDefinition": {
        "buildType": "https://gitlab.com/${CI_PROJECT_PATH}/-/blob/${CI_COMMIT_REF_NAME}/.gitlab-ci.yml",
        "externalParameters": {
          "pipelineSource": "${CI_PIPELINE_SOURCE}",
          "commitSha": "${CI_COMMIT_SHA}",
          "commitRef": "${CI_COMMIT_REF_NAME}",
          "commitTag": "${CI_COMMIT_TAG}"
        },
        "internalParameters": {
          "jobName": "${CI_JOB_NAME}",
          "runnerDescription": "${RUNNER_DESCRIPTION}",
          "architectures": ["amd64", "arm64"]
        },
        "resolvedDependencies": [
          {
            "uri": "git+https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}",
            "digest": {
              "gitCommit": "${CI_COMMIT_SHA}"
            },
            "name": "source"
          }
        ]
      },
      "runDetails": {
        "builder": {
          "id": "${CI_JOB_URL}"
        },
        "metadata": {
          "invocationId": "${CI_JOB_URL}",
          "startedOn": "$( date --utc +%Y-%m-%dT%H:%M:%SZ )"
        }
      }
    }
    EOF
    jq . provenance-predicate-${TAG}${TAG_SUFFIX}.json
  - |
    echo "### Attesting image ${CI_REGISTRY_IMAGE}:${TAG}${TAG_SUFFIX}"
  - |
    cosign attest --yes \
        --predicate "provenance-predicate-${TAG}${TAG_SUFFIX}.json" \
        --type slsaprovenance1 \
        --registry-username "${CI_REGISTRY_USER}" \
        --registry-password "${CI_REGISTRY_PASSWORD}" \
        "${CI_REGISTRY_IMAGE}:${TAG}${TAG_SUFFIX}"
  artifacts:
    paths:
    - provenance-predicate-${TAG}${TAG_SUFFIX}.json

.clean:intermediate_tags:
  needs:
  - prepare
  - build:image
  - build:multi_arch_index
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "noble"
      - "resolute"
      - "rolling"
      - "resolute-systemd"
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    echo "### Removing intermediate tags for ${CI_REGISTRY_IMAGE}:${TAG}"
  - |
    DIGEST_AMD64="$( cat image-digest-${TAG}-${TAG_SUFFIX}-amd64.json )"
    DIGEST_ARM64="$( cat image-digest-${TAG}-${TAG_SUFFIX}-arm64.json )"
    echo "    Digest amd64: ${DIGEST_AMD64}"
    echo "    Digest arm64: ${DIGEST_ARM64}"
  - |
    regctl manifest delete "${CI_REGISTRY_IMAGE}:${TAG}-${TAG_SUFFIX}-amd64@${DIGEST_AMD64}"
    regctl manifest delete "${CI_REGISTRY_IMAGE}:${TAG}-${TAG_SUFFIX}-arm64@${DIGEST_ARM64}"

update:default_tag:
  needs:
  - prepare
  - build:multi_arch_index
  - job: sign:image
    optional: true
  - job: attest:image
    optional: true
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "noble"
      - "resolute"
      - "rolling"
      - "resolute-systemd"
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    regctl image copy \
        "${CI_REGISTRY_IMAGE}:${TAG}-${TAG_SUFFIX}" \
        "${CI_REGISTRY_IMAGE}:${TAG_SUFFIX}"

update:latest_tag:
  needs:
  - prepare
  - build:multi_arch_index
  - job: sign:image
    optional: true
  - job: attest:image
    optional: true
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    regctl image copy \
        "${CI_REGISTRY_IMAGE}:${TAG}-resolute" \
        "${CI_REGISTRY_IMAGE}:latest"

update:version_tag:
  needs:
  - prepare
  - build:multi_arch_index
  - job: sign:image
    optional: true
  - job: attest:image
    optional: true
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    regctl image copy \
        "${CI_REGISTRY_IMAGE}:${TAG}-resolute" \
        "${CI_REGISTRY_IMAGE}:${TAG}"