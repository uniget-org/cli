include:
- local: pipeline/docker.yaml

prepare:
  rules:
  - if: $CI_MERGE_REQUEST_ID
  - when: always
  variables:
    GIT_DEPTH: 0
  script: |
    version="$( git describe --tags --abbrev=0 | tr -d v )"
    TAG="${version}"

    echo "Found version: ${version}"

    echo "version=${version}" >>build.env
    echo "TAG=${TAG}" >>build.env
  artifacts:
    reports:
      dotenv: build.env

build:image:
  rules:
  - if: $CI_MERGE_REQUEST_ID
  - when: always
  needs:
  - prepare
  parallel:
    matrix:
    - ARCH:
      - "amd64"
      - "arm64"
      BUILD_EXTRA_ARGS: "--target=ubuntu-uniget"
      TAG_SUFFIX: "-noble"
      CONTEXT: images/noble
    - ARCH:
      - "amd64"
      - "arm64"
      BUILD_EXTRA_ARGS: "--target=ubuntu-uniget"
      TAG_SUFFIX: "-resolute"
      CONTEXT: images/resolute
    - ARCH:
      - "amd64"
      - "arm64"
      BUILD_EXTRA_ARGS: "--target=systemd-uniget"
      TAG_SUFFIX: "-resolute-systemd"
      CONTEXT: images/resolute-systemd
  extends:
  - .docker:build
  variables:
    BUILD_CONTEXT: ${CONTEXT}
    BUILD_ARGS: version
  tags:
  - saas-linux-medium-${ARCH}

build:index_amd64:
  needs:
  - prepare
  - build:image
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "-noble"
      - "-resolute"
      - "-resolute-systemd"
  extends:
  - .build:multi_arch_index_incremental_create_amd64

build:index_arm64:
  needs:
  - prepare
  - build:image
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "-noble"
      - "-noble-systemd"
      - "-resolute"
      - "-resolute-systemd"
  extends:
  - .build:multi_arch_index_incremental_add_arm64

.clean:intermediate_tags:
  needs:
  - prepare
  - build:image
  - build:index_amd64
  - build:index_arm64
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "noble"
      - "noble-systemd"
      - "resolute"
      - "resolute-systemd"
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    echo "### Removing intermediate tags for ${CI_REGISTRY_IMAGE}:${TAG}"
  - |
    DIGEST_AMD64="$( cat image-digest-${TAG}-${TAG_SUFFIX}-amd64.json )"
    DIGEST_ARM64="$( cat image-digest-${TAG}-${TAG_SUFFIX}-arm64.json )"
    echo "    Digest amd64: ${DIGEST_AMD64}"
    echo "    Digest arm64: ${DIGEST_ARM64}"
  - |
    regctl manifest delete "${CI_REGISTRY_IMAGE}:${TAG}-${TAG_SUFFIX}-amd64@${DIGEST_AMD64}"
    regctl manifest delete "${CI_REGISTRY_IMAGE}:${TAG}-${TAG_SUFFIX}-arm64@${DIGEST_ARM64}"

update:default_tag:
  needs:
  - prepare
  - build:index_amd64
  parallel:
    matrix:
    - TAG_SUFFIX:
      - "noble"
      - "noble-systemd"
      - "resolute"
      - "resolute-systemd"
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    regctl image copy \
        "${CI_REGISTRY_IMAGE}:${TAG}-${TAG_SUFFIX}" \
        "${CI_REGISTRY_IMAGE}:${TAG_SUFFIX}"

update:latest_tag:
  needs:
  - prepare
  - build:index_amd64
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    regctl image copy \
        "${CI_REGISTRY_IMAGE}:${TAG}-resolute" \
        "${CI_REGISTRY_IMAGE}:latest"

update:version_tag:
  needs:
  - prepare
  - build:index_amd64
  extends:
  - .regctl
  - .regctl-login
  script:
  - |
    regctl image copy \
        "${CI_REGISTRY_IMAGE}:${TAG}-resolute" \
        "${CI_REGISTRY_IMAGE}:${TAG}"