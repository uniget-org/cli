include:
- local: pipeline/docker.yaml
- component: $CI_SERVER_FQDN/uniget-org/components/renovate@renovate/1.0
  inputs:
    rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "renovate"
    - if: $CI_PIPELINE_SOURCE == "web" && $SCHEDULED_JOB == "renovate"
    token_variable_name: RENOVATE_GROUP_TOKEN
    github_token_variable_name: RENOVATE_GITHUB_TOKEN

test:
  rules:
  - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
    changes:
    - "**/*.go"
    - go.mod
    - go.sum
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
    - "**/*.go"
    - go.mod
    - go.sum
  - if: $CI_PIPELINE_SOURCE == "web" && $SCHEDULED_JOB == "test"
  trigger:
    include: pipeline/test.yaml
    strategy: depend

release_notes:
  rules:
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  image: registry.gitlab.com/uniget-org/cli:noble
  variables:
    GIT_DEPTH: 0
    GLAB_SEND_TELEMETRY: 0
  before_script: |
    uniget install glab 
    glab auth login --hostname="${CI_SERVER_HOST}" --token="${BACKLOG_TOKEN}"
  script: |
    bash scripts/release-notes.sh >release-notes.md
  artifacts:
    paths:
    - release-notes.md

release:
  rules:
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  needs:
  - test
  - release_notes
  extends:
  - .docker
  - .docker:dind
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    GIT_DEPTH: 0
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  before_script: |
    if ! test -s release-notes.md; then
      echo "Release notes not found"
      exit 1
    fi
  script:
  - test -n "$CI_SERVER_HOST"
  - test -n "$CI_JOB_TOKEN"
  - test -n "$GITLAB_TOKEN"
  - test -n "$SIGSTORE_ID_TOKEN"
  - |
    docker buildx build \
        --target=publish \
        --build-arg=CI_SERVER_HOST \
        --build-arg=CI_JOB_TOKEN \
        --build-arg=GITLAB_TOKEN=${CI_JOB_TOKEN} \
        --build-arg=SIGSTORE_ID_TOKEN \
        .
  artifacts:
    paths:
    - "*-metadata.json"
  tags:
  - saas-linux-medium-amd64

images:
  rules:
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    needs:
    - release
    variables:
      PUSH: "true"
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    changes:
    - "images/*/Dockerfile"
    variables:
      PUSH: "false"
  - if: $CI_PIPELINE_SOURCE == "web"
    variables:
      PUSH: "true"
  - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "daily_rebuild"
    variables:
      PUSH: "true"
  - if: $CI_PIPELINE_SOURCE == "web" && $SCHEDULED_JOB == "images"
  - if: $CI_PIPELINE_SOURCE == "web" && $SCHEDULED_JOB == "test-images"
    variables:
      PUSH: "false"
  trigger:
    include: pipeline/image.yaml
    strategy: depend

deps:
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_JOB == "dependency_updates"
  - when: never
  image: golang:1.27.1
  before_script: |
    curl -sLf https://gitlab.com/uniget-org/cli/-/releases/permalink/latest/downloads/uniget_Linux_$(uname -m).tar.gz \
    | tar -xzC /usr/local/bin uniget
    uniget update

    uniget install glab
    glab auth login --hostname="${CI_SERVER_HOST}" --token="${GITLAB_COMMIT_TOKEN}"
  script: |
    git config user.name "Commit Bot"
    git config user.email "commit-bot@uniget.dev"
    git remote set-url origin "https://oauth2:${GITLAB_COMMIT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

    echo "### Bump dependencies in Dockerfile"
    uniget bump dockerfile
    #uniget bump dockerfile --file=.devcontainer/Dockerfile
    echo "### Bump dependencies in GitLab CI configuration"
    uniget bump gitlab-ci

    echo "### Switch to branch for dependency updates"
    git checkout -b "dependency-updates"

    echo "### Bump dependencies in Go modules"
    go get -u ./...
    go mod tidy

    if git diff --quiet -- go.mod go.sum Dockerfile .gitlab-ci.yml; then
      echo "No dependency changes to commit."
      exit 0
    fi
    echo "### Commit dependency updates"
    git add go.mod go.sum Dockerfile .gitlab-ci.yml
    git commit -m "chore: Update dependencies (pipeline ${CI_PIPELINE_IID})"
    echo "### Push dependency updates"
    git push origin HEAD:refs/heads/dependency-updates

    MR_ID="$( glab mr list --source-branch=dependency-updates --output=json --jq '.[].iid' )"
    if test -n "${MR_ID}"; then
        echo "### Rebasing merge request ${MR_ID}"
        glab mr rebase "${MR_ID}"

        exit 0
    fi
    echo "### No existing merge request found for dependency updates."

    echo "### Create merge request for dependency updates"
    glab mr create \
      --source-branch "dependency-updates" \
      --target-branch "${CI_DEFAULT_BRANCH}" \
      --title "chore: Update dependencies" \
      --description "Automated dependency update by Commit Bot from pipeline ${CI_PIPELINE_IID}." \
      --remove-source-branch \
      --yes