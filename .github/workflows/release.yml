name: Mirror GitLab Release

on:
  push:
    tags:
    - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to mirror (e.g. v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  mirror-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mirror release from GitLab
        shell: bash
        run: |
          set -euo pipefail

          TAG_NAME="${{ inputs.tag }}"
          if test -z "$TAG_NAME"; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          if [[ ! $TAG_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid tag name '$TAG_NAME'. Expected format: vX.Y.Z"
            exit 1
          fi
          echo "Using tag name: $TAG_NAME"

          SECONDS=0
          curl --silent --show-error --location --fail --output release.json "https://gitlab.com/api/v4/projects/uniget-org%2fcli/releases/${TAG_NAME}" || true
          while ! test -f release.json; do
            if [ $SECONDS -ge $((30 * 60)) ]; then
              echo "ERROR: Timed out waiting for GitLab release for tag <$TAG_NAME>."
              exit 1
            fi  

            echo "Release not available yet. Waiting..."
            sleep $((10 * 60))
            curl --silent --show-error --location --fail --output release.json "https://gitlab.com/api/v4/projects/uniget-org%2fcli/releases/${TAG_NAME}" || true
          done

          if ! test -s release.json; then
              echo "ERROR: GitLab release for tag $TAG_NAME not found."
              exit 1
          fi

          title="$(jq -r '.name // .tag_name' release.json)"
          echo "Release title: $title"
          notes_file=release_notes.md
          {
            echo "Mirrored from GitLab: https://gitlab.com/uniget-org/cli/-/releases/${TAG_NAME}"
            echo
            jq -r '.description // ""' release.json
          } >"${notes_file}"

          mkdir -p assets
          echo "Downloading assets for release ${TAG_NAME}"
          pushd assets
          cat ../release.json \
          | jq --raw-output '.assets.links[].url' \
          | xargs -I{} \
              curl --silent --show-error --location --fail "{}" --remote-name
          popd

          echo "Creating/updating GitHub release for tag ${TAG_NAME}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Updating existing GitHub release ${TAG_NAME}"
            gh release edit "${TAG_NAME}" --title "${title}" --notes-file "${notes_file}"
          else
            echo "Creating GitHub release ${TAG_NAME}"
            gh release create "${TAG_NAME}" --title "${title}" --notes-file "${notes_file}"
          fi

          echo "Uploading assets for release ${TAG_NAME}"
          gh release upload "${TAG_NAME}" assets/*
